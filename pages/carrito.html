<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - ETERNA FRAGANCIA</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/carrito.css">
    <link rel="stylesheet" href="../css/formularios.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="cart-body">
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="logo-container">
                <a href="../index.html" class="logo" title="Volver a ETERNA FRAGANCIA">
                    <img class="logo-badge" src="../EF LOGO.png" alt="ETERNA FRAGANCIA">
                </a>
            </div>
            
            <div class="header-actions">
                <a href="carrito.html" class="cart-link active" title="Carrito actual">
                    <div class="cart-icon-wrap">
                        <svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 4h2l2.1 10.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.4L20 8H6"></path>
                            <circle cx="9" cy="19" r="1"></circle>
                            <circle cx="18" cy="19" r="1"></circle>
                        </svg>
                        <span class="cart-count" id="cartCount">0</span>
                    </div>
                    <span class="cart-label">Carrito</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Contenido Principal del Carrito -->
    <main class="cart-container">
        <div class="cart-page-header">
            <h1 class="cart-page-title">Tu Carrito de Compras</h1>
            <p class="cart-page-subtitle">Revisa tus productos y finaliza tu pedido fácil y rápido por WhatsApp</p>
        </div>

        <div class="cart-wrapper">
            <section class="cart-items-section">
                <h2 class="summary-title">Resumen del pedido</h2>
                <div id="cartItems" class="cart-items">
                    <!-- Se llena dinámicamente -->
                </div>

                <!-- Estado Carrito Vacío -->
                <div id="emptyCartMessage" class="empty-cart hidden">
                    <div class="empty-cart-icon" aria-hidden="true">
                        <svg viewBox="0 0 48 48" role="img" aria-label="Carrito vacío">
                            <path d="M7 10h5l3.2 19.1a3 3 0 0 0 3 2.5h16.3a3 3 0 0 0 2.9-2.3L41 17H14"></path>
                            <circle cx="20" cy="38" r="2"></circle>
                            <circle cx="35" cy="38" r="2"></circle>
                        </svg>
                    </div>
                    <h2>Tu carrito está vacío</h2>
                    <p>Agregá productos para comenzar tu pedido.</p>
                    <a href="../index.html" class="btn-primary btn-empty-cart">Ver productos</a>
                </div>
            </section>

            <aside class="cart-summary">
                <div class="summary-item total">
                    <span class="summary-label">Total:</span>
                    <span class="summary-val" id="total">$0</span>
                </div>

                <button id="checkoutBtn" class="btn-checkout">
                    <svg class="whatsapp-button-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20.5 11.8a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.3-4.7a8.5 8.5 0 1 1 16.2-4Z"></path>
                        <path d="M8.8 8.2c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.7 1.6c.1.3.1.5-.1.7l-.5.6c.7 1.2 1.5 2 2.7 2.6l.6-.5c.2-.2.4-.2.7-.1l1.6.7c.3.1.4.3.4.6v.5c0 .3-.1.5-.4.7-.5.3-1 .4-1.6.3-2.6-.5-5.7-3.6-6.2-6.2-.1-.5 0-1.1.4-1.5Z"></path>
                    </svg>
                    Enviar pedido por WhatsApp
                </button>
                <div class="cart-summary-store-link">
                    <a href="../index.html" class="back-btn">← Volver a la tienda</a>
                </div>
            </aside>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 ETERNA FRAGANCIA. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="../js/configuracion.js"></script>
    <script src="../js/productos.js"></script>
    <script src="../js/carrito.js"></script>
    <script src="../js/whatsapp.js"></script>
    <script src="../js/carrito-page.js"></script>
</body>
</html>
