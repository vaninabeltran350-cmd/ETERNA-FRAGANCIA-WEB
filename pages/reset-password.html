<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña - ETERNA FRAGANCIA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/formularios.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>
        .reset-password-form .form-group + .form-group {
            margin-top: 1rem;
        }

        .reset-password-input-wrap {
            position: relative;
        }

        .reset-password-input-wrap .form-input {
            padding-right: 3rem;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 0.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--color-text-muted);
            cursor: pointer;
            transform: translateY(-50%);
        }

        .password-toggle:hover,
        .password-toggle:focus-visible {
            color: var(--color-primary-gold);
        }

        .password-toggle svg {
            width: 1.15rem;
            height: 1.15rem;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.6;
        }

        .password-toggle .icon-eye-off {
            display: none;
        }

        .password-toggle.is-visible .icon-eye {
            display: none;
        }

        .password-toggle.is-visible .icon-eye-off {
            display: block;
        }

        .reset-password-requirement {
            display: block;
            margin-top: 0.45rem;
            color: var(--color-text-muted);
            font-size: 0.75rem;
            line-height: 1.4;
        }

        .reset-password-status.success {
            background-color: #dcfce7;
            border-color: #bbf7d0;
            color: #166534;
        }

        .reset-password-status:not(.success) {
            text-align: left;
        }

        .recovery-captcha {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body class="login-page">
    <header class="header login-header">
        <div class="header-container">
            <div class="logo-container">
                <a href="../index.html" class="logo" title="Volver a la Tienda">
                    <img class="logo-badge" src="../EF LOGO.png" alt="ETERNA FRAGANCIA">
                </a>
            </div>
        </div>
    </header>

    <main class="login-container">
        <section class="login-card" aria-labelledby="resetPasswordTitle">
            <div class="login-badge-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                    <path d="M12 14v2"></path>
                </svg>
            </div>
            <h1 id="resetPasswordTitle" class="login-title">Cambiar contraseña</h1>
            <p id="resetPasswordSubtitle" class="login-subtitle">Elegí una nueva contraseña segura para tu cuenta de administrador.</p>

            <div id="recoveryRequestView">
                <p class="login-subtitle">Ingresá tu correo y te enviaremos un enlace para recuperar el acceso.</p>
                <form id="recoveryRequestForm" class="login-form" novalidate>
                    <div class="form-group">
                        <label for="recoveryEmail">Correo electrónico</label>
                        <input type="email" id="recoveryEmail" class="form-input" required autocomplete="email">
                    </div>
                    <div class="recovery-captcha" aria-label="Verificación de seguridad">
                        <h-captcha id="recoveryCaptcha" sitekey="ff4a2a32-d8be-4a96-b502-ef402f326272" tabindex="0"></h-captcha>
                    </div>
                    <button type="submit" class="btn-login">Enviar enlace de recuperación</button>
                </form>
            </div>

            <form id="resetPasswordForm" class="login-form reset-password-form hidden" novalidate>
                <div class="form-group">
                    <label for="newPassword">Nueva contraseña</label>
                    <div class="reset-password-input-wrap">
                        <input type="password" id="newPassword" class="form-input" required minlength="12" autocomplete="new-password">
                        <button type="button" class="password-toggle" data-password-target="newPassword" aria-label="Mostrar nueva contraseña" aria-pressed="false">
                            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18"></path><path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18.6 18.6 0 0 1-3.1 3.5"></path><path d="M6.5 6.8C3.5 8.5 2 12 2 12s3.5 6 10 6a10.8 10.8 0 0 0 3-.4"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
                        </button>
                    </div>
                    <small class="reset-password-requirement">Mínimo de 12 caracteres.</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar nueva contraseña</label>
                    <div class="reset-password-input-wrap">
                        <input type="password" id="confirmPassword" class="form-input" required minlength="12" autocomplete="new-password">
                        <button type="button" class="password-toggle" data-password-target="confirmPassword" aria-label="Mostrar confirmación de contraseña" aria-pressed="false">
                            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18"></path><path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18.6 18.6 0 0 1-3.1 3.5"></path><path d="M6.5 6.8C3.5 8.5 2 12 2 12s3.5 6 10 6a10.8 10.8 0 0 0 3-.4"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">Cambiar contraseña</button>
            </form>

            <div id="resetPasswordStatus" class="error-message reset-password-status hidden" role="status" aria-live="polite"></div>

            <p class="login-help">
                <a href="login.html" class="btn-back-store">Volver al acceso</a>
            </p>
        </section>
    </main>

    <script type="module" src="../js/supabase-auth.js"></script>
    <script>
        const resetPasswordForm = document.getElementById('resetPasswordForm');
        const recoveryRequestForm = document.getElementById('recoveryRequestForm');
        const recoveryRequestView = document.getElementById('recoveryRequestView');
        const resetPasswordSubtitle = document.getElementById('resetPasswordSubtitle');
        const resetPasswordStatus = document.getElementById('resetPasswordStatus');
        const recoveryCaptcha = document.getElementById('recoveryCaptcha');
        let captchaToken = '';

        function showResetPasswordStatus(message, type = 'error') {
            resetPasswordStatus.textContent = message;
            resetPasswordStatus.className = `error-message reset-password-status ${type === 'success' ? 'success' : ''}`;
        }

        document.querySelectorAll('.password-toggle').forEach((toggle) => {
            toggle.addEventListener('click', () => {
                const input = document.getElementById(toggle.dataset.passwordTarget);
                const visible = input.type === 'text';
                input.type = visible ? 'password' : 'text';
                toggle.classList.toggle('is-visible', !visible);
                toggle.setAttribute('aria-pressed', String(!visible));
                toggle.setAttribute('aria-label', `${visible ? 'Mostrar' : 'Ocultar'} ${input.id === 'newPassword' ? 'nueva contraseña' : 'confirmación de contraseña'}`);
            });
        });

        function resetRecoveryCaptcha() {
            captchaToken = '';
            if (!recoveryCaptcha) return;
            try {
                recoveryCaptcha.reset();
            } catch (error) {
                console.error('Error reiniciando hCaptcha:', error);
            }
        }

        recoveryCaptcha?.addEventListener('verified', (event) => {
            captchaToken = event.token || '';
        });

        recoveryCaptcha?.addEventListener('expired', () => {
            captchaToken = '';
            showResetPasswordStatus('La verificación expiró. Completá el CAPTCHA nuevamente.');
        });

        recoveryCaptcha?.addEventListener('error', () => {
            captchaToken = '';
            showResetPasswordStatus('No se pudo cargar la verificación CAPTCHA. Intentá nuevamente.');
        });

        function showPasswordResetView() {
            recoveryRequestView.classList.add('hidden');
            resetPasswordForm.classList.remove('hidden');
            resetPasswordSubtitle.textContent = 'Elegí una nueva contraseña segura para tu cuenta de administrador.';
        }

        function isRecoveryHash() {
            const hash = window.location.hash.startsWith('#')
                ? window.location.hash.slice(1)
                : window.location.hash;
            return new URLSearchParams(hash).get('type') === 'recovery';
        }

        const recoveryLinkAtLoad = isRecoveryHash();

        async function initializeRecoveryView() {
            if (!window.SupabaseAuth?.isConfigured) return;

            window.SupabaseAuth.onAuthStateChange((event) => {
                if (event === 'PASSWORD_RECOVERY') {
                    showPasswordResetView();
                }
            });

            if (!recoveryLinkAtLoad) return;

            try {
                if (await window.SupabaseAuth.getSession()) {
                    showPasswordResetView();
                }
            } catch (error) {
                console.error('Error verificando la sesión de recuperación:', error);
            }
        }

        recoveryRequestForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const email = document.getElementById('recoveryEmail').value.trim();
            const submitButton = recoveryRequestForm.querySelector('button[type="submit"]');

            if (!email) {
                showResetPasswordStatus('Ingresá un correo electrónico válido.');
                return;
            }
            if (!window.SupabaseAuth?.isConfigured) {
                showResetPasswordStatus('No se pudo conectar con el servicio de autenticación.');
                return;
            }
            if (!captchaToken) {
                showResetPasswordStatus('Completá la verificación CAPTCHA para continuar.');
                return;
            }

            if (submitButton) submitButton.disabled = true;
            try {
                await window.SupabaseAuth.resetPasswordForEmail(email, captchaToken);
                showResetPasswordStatus('Si el correo está registrado, recibirás un enlace para recuperar la contraseña.', 'success');
                recoveryRequestForm.reset();
            } catch (error) {
                console.error('Error solicitando recuperación de contraseña:', error);
                showResetPasswordStatus('No se pudo enviar el enlace de recuperación. Intentá nuevamente.');
            } finally {
                resetRecoveryCaptcha();
                if (submitButton) submitButton.disabled = false;
            }
        });

        resetPasswordForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitButton = resetPasswordForm.querySelector('button[type="submit"]');

            if (newPassword.length < 12) {
                showResetPasswordStatus('La contraseña debe tener como mínimo 12 caracteres.');
                return;
            }

            if (newPassword !== confirmPassword) {
                showResetPasswordStatus('Las contraseñas no coinciden.');
                return;
            }

            if (!window.SupabaseAuth?.isConfigured) {
                showResetPasswordStatus('No se pudo conectar con el servicio de autenticación.');
                return;
            }

            if (submitButton) submitButton.disabled = true;
            try {
                if (!await window.SupabaseAuth.getSession()) {
                    throw new Error('RECOVERY_SESSION_MISSING');
                }
                await window.SupabaseAuth.updatePassword(newPassword);
                resetPasswordForm.reset();
                showResetPasswordStatus('La contraseña se actualizó correctamente.', 'success');
            } catch (error) {
                console.error('Error actualizando la contraseña con Supabase:', error);
                showResetPasswordStatus('No se pudo actualizar la contraseña. Solicita un nuevo enlace de recuperación.');
            } finally {
                if (submitButton) submitButton.disabled = false;
            }
        });

        window.addEventListener('supabase-auth-ready', initializeRecoveryView, { once: true });
        initializeRecoveryView();
    </script>
</body>
</html>
